name: Deploy VPS

# Deploys website, Office (backoffice), API, and Expo web app to AIC Cloud VPS via SSH.
# Android native builds use the separate "EAS Android" workflow.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Set repository variable VPS_DEPLOY_ENABLED=true after SSH secrets are configured.
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ vars.VPS_APP_DIR }}"
            APP_DIR="${APP_DIR:-$HOME/britbee}"
            BRANCH="${{ github.ref_name }}"
            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            export EXPO_PUBLIC_API_URL="${EXPO_PUBLIC_API_URL:-https://api.britbee.app}"
            export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://api.britbee.app}"
            pnpm install --frozen-lockfile
            pnpm --filter @britbee/website build
            pnpm --filter @britbee/office build
            cd app && EXPO_NO_METRO_WORKSPACE_ROOT=1 pnpm exec expo export --platform web && cd ..
            pm2 reload "$APP_DIR/deploy/pm2.ecosystem.cjs" --update-env || pm2 start "$APP_DIR/deploy/pm2.ecosystem.cjs"
            pm2 save
            curl -fsS "http://127.0.0.1:3001/health" | head -c 200
            echo
            echo "Deploy OK @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
