name: Deploy VPS

# Auto-deploy on push to master/main:
# 1) Build website + Office + Expo web in GitHub Actions (not on the 1GB VPS)
# 2) rsync code + artifacts to /opt/britbee (never overwrites .env)
# 3) SSH remote-release.sh → pnpm install + nginx + pm2 reload
#
# Prerequisites (repo Settings → Secrets / Variables):
#   secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT
#   vars:    VPS_DEPLOY_ENABLED=true, VPS_APP_DIR=/opt/britbee
#            EXPO_PUBLIC_API_URL, NEXT_PUBLIC_API_URL (e.g. http://api.britbee.buzz)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.VPS_DEPLOY_ENABLED == 'true' }}
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://api.britbee.buzz' }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://api.britbee.buzz' }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/britbee' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm --filter @britbee/website build

      - name: Build office
        run: pnpm --filter @britbee/office build

      - name: Export Expo web
        working-directory: app
        run: EXPO_NO_METRO_WORKSPACE_ROOT=1 pnpm exec expo export --platform web

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync release (preserve server .env)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          RSYNC_SSH="ssh -i $HOME/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=accept-new"
          # Ensure remote dir exists
          $RSYNC_SSH "${USER}@${HOST}" "mkdir -p ${APP_DIR}"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '**/node_modules/' \
            --exclude 'office/.next-dev/' \
            --exclude 'office/.next/' \
            --exclude 'api/data/' \
            --exclude 'app/assets/chat/uploads/' \
            --exclude 'app/assets/billing/proofs/' \
            --exclude 'app/assets/learn/uploads/' \
            --exclude '.DS_Store' \
            --exclude 'agent-transcripts/' \
            --exclude 'design/' \
            -e "$RSYNC_SSH" \
            ./ "${USER}@${HOST}:${APP_DIR}/"

      - name: Remote install + reload
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            chmod +x /opt/britbee/deploy/remote-release.sh
            APP_DIR="/opt/britbee" bash /opt/britbee/deploy/remote-release.sh
