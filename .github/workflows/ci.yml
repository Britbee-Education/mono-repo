name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      office: ${{ steps.filter.outputs.office }}
      website: ${{ steps.filter.outputs.website }}
      app: ${{ steps.filter.outputs.app }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            office:
              - 'office/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            website:
              - 'website/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            app:
              - 'app/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            shared:
              - 'packages/**'
              - 'pnpm-lock.yaml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck API
        run: pnpm --filter @britbee/api exec tsc --noEmit -p tsconfig.json

  office:
    needs: changes
    if: needs.changes.outputs.office == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.britbee.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @britbee/office build

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @britbee/website build

  app-web:
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://api.britbee.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export Expo web
        working-directory: app
        run: pnpm exec expo export --platform web
