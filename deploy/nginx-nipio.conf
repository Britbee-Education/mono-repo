# Public :80 via IPv6 nip.io (AIC IPv4 edge parks domains on Caddy).
# IPv6: 2001:41d0:a:4a2d::23c9 → 2001-41d0-a-4a2d--23c9.nip.io

upstream britbee_api {
  server 127.0.0.1:3001;
}
upstream britbee_office {
  server 127.0.0.1:3003;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 2001-41d0-a-4a2d--23c9.nip.io 37.187.140.45 _;
  root /opt/britbee/website/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name app.2001-41d0-a-4a2d--23c9.nip.io;
  root /opt/britbee/app/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.2001-41d0-a-4a2d--23c9.nip.io;
  client_max_body_size 25m;
  location / {
    proxy_pass http://britbee_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name office.2001-41d0-a-4a2d--23c9.nip.io;
  location / {
    proxy_pass http://britbee_office;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
