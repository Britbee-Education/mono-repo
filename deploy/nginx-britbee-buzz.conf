# britbee.buzz — lander on :80, Expo web app on :8080 only.
# API (3001) and Office (3003) stay on PM2; map those hostnames in AIC to those ports.
# Do not proxy api/office here.

# Lander — port 80
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name britbee.buzz www.britbee.buzz _;
  root /opt/britbee/website/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}

# Expo web app — port 8080 only (map app.britbee.buzz → 8080 in AIC)
server {
  listen 8080;
  listen [::]:8080;
  server_name app.britbee.buzz _;
  root /opt/britbee/app/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
