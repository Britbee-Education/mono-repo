# BritBee beta — run on an AIC Cloud VPS (Ubuntu + Docker)
# https://aiccloud.in/
#
# Usage (from repo root):
#   cp deploy/env.production.example .env.production
#   # edit domains + secrets
#   docker compose -f deploy/docker-compose.yml --env-file .env.production up -d --build

name: britbee-beta

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - britbee_mongo:/data/db
    networks:
      - britbee

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env.production
    environment:
      MEMORY_DB: "0"
      API_PORT: "3001"
      MONGODB_URI: mongodb://mongo:27017/britbee
    volumes:
      - ../.env.production:/app/.env:ro
      - britbee_api_data:/app/api/data
    depends_on:
      - mongo
    networks:
      - britbee

  office:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.office
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.britbee.app}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.britbee.app}
    depends_on:
      - api
    networks:
      - britbee

  website:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.website
    restart: unless-stopped
    networks:
      - britbee

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEBSITE_HOST: ${WEBSITE_HOST:-localhost}
      API_HOST: ${API_HOST:-api.localhost}
      OFFICE_HOST: ${OFFICE_HOST:-office.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - website
      - api
      - office
    networks:
      - britbee

volumes:
  britbee_mongo:
  britbee_api_data:
  caddy_data:
  caddy_config:

networks:
  britbee:
    driver: bridge
